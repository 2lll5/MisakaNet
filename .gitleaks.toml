title = "MisakaNet gitleaks configuration"

# Extend default rules (github PATs, slack tokens, AWS keys, etc.)
[extend]
useDefault = true

# MisakaNet allowlist: intentional false positives.
# - lessons/hook-raw archives contain redacted incident transcripts (REDACTED placeholders)
# - tests/test_intake_redaction.py uses masked fixtures (ghp_ABCDEF***)
# - docs/index.html CSS/JS strings trip generic-api-key
[allowlist]
description = "MisakaNet intentional false positives (test fixtures, redacted placeholders, CSS)"
paths = [
    '''docs/index.html''',
]
regexTarget = "secret"
regexes = [
    '''REDACTED''',
    '''\*''',                    # masked fixtures like ghp_ABCDEF***
    '''token_hex''',             # Python secrets.token_hex() API call
    '''REPLACE_WITH''',
    '''xoxb-''',                 # test slack fixture
]
